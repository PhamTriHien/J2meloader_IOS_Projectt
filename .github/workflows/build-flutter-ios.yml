name: Build Flutter iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: universal_loader/ui_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build unsigned device app
        run: flutter build ios --release --no-codesign --no-tree-shake-icons
      - name: Package IPA
        run: |
          mkdir -p build/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned/Payload/
          cd build/unsigned
          zip -qr ../J5Hienloader-unsigned.ipa Payload
      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-tree-shake-icons
      - name: Package simulator app for Appetize
        run: |
          cd build/ios/iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Runner.app ../../J5Hienloader-simulator.zip
      - name: Launch app in iOS Simulator
        run: |
          mkdir -p build/ios-smoke
          xcrun simctl list devices available --json > build/ios-smoke/devices.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("build/ios-smoke/devices.json")); print(next(v["udid"] for k, vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/ios/iphonesimulator/Runner.app/Info.plist)
          xcrun simctl launch --terminate-running-process --stdout=build/ios-smoke/stdout.log --stderr=build/ios-smoke/stderr.log "$DEVICE" "$BUNDLE_ID"
          sleep 15
          xcrun simctl io "$DEVICE" screenshot build/ios-smoke/startup.png
          xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'process == "Runner"' > build/ios-smoke/system.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: J5Hienloader-Flutter-iOS
          if-no-files-found: warn
          path: |
            universal_loader/ui_app/build/J5Hienloader-unsigned.ipa
            universal_loader/ui_app/build/J5Hienloader-simulator.zip
            universal_loader/ui_app/build/ios-smoke/
