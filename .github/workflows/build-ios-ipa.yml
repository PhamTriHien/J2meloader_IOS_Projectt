name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2MELoader-iOS-ipa
          path: |
            build/J2MELoader-iOS.ipa
            ios/J2MELoader-iOS/build/J2MELoader-iOS.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.2-ios
          name: "J2ME-Loader iOS v1.8.2 Full Native Release"
          body: |
            ## J2ME-Loader for iOS & iPadOS (Native Port v1.8.2)
            
            ### Features
            - **Pure Swift + Metal LCDUI Rendering Engine**: High performance 60 FPS hardware accelerated graphics with custom CRT Scanlines & Nokia LCD Subpixel Grid shaders.
            - **Full J2ME / MIDP 2.0 Subsystems**:
              - MIDlet lifecycle management (JAD/JAR parsing, RMS Record Management System flash memory storage)
              - Micro3D v3 (JSR-184 & MBAC/TRA 3D model engine) & M3G Mobile 3D Graphics
              - GameCanvas (Sprites, TiledLayers, LayerManager, pixel-level collision detection)
              - Sonivox EAS MIDI engine & CoreAudio tone synthesizer
              - Complete configurable retro on-screen virtual keypad + Gamepad/MFi Bluetooth controller remapping
            
            ### Installation Instructions
            1. Download `J2MELoader-iOS.ipa` attached below.
            2. Install via **TrollStore**, **Sideloadly**, **AltStore**, **Scarlet**, or **Feather**.
            3. Tap the `+` button in the app to import any `.jar` or `.jad` game file.
          files: |
            build/J2MELoader-iOS.ipa
            ios/J2MELoader-iOS/build/J2MELoader-iOS.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}