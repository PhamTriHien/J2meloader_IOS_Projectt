name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-IPA
          path: |
            **/build/*.ipa

      - name: Upload Simulator Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-Simulator
          path: |
            **/build/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0-j2hienloader
          name: "J2HienLoader iOS v2.0.0 - Đại Tu Toàn Diện: GC Mark-and-Sweep, Cache Bytecode, Zero-Copy GPU, Gamepad MFi & Thư Viện Grid"
          body: |
            ## J2HienLoader cho iOS & iPadOS (Bản chính thức v2.0.0)
            Ứng dụng giả lập J2ME chuẩn cho hệ điều hành iOS/iPadOS, nạp và chạy file .jar trực tiếp.
            
            ### Các cải tiến & chuẩn hóa đột phá trong v2.0.0:
            - **Core Emulation & Memory Garbage Collection**: Triển khai thuật toán Mark-and-Sweep Garbage Collection tự động duyệt root-set từ active stack frames, static fields và midlet runtime, xóa sạch rò rỉ bộ nhớ ngăn chặn hoàn toàn hiện tượng Jetsam crash khi chơi lâu.
            - **Fast-Path Method Invocation Caching**: Tối ưu bộ đệm tham số descriptor và cờ void trong `CpEntry`, loại bỏ hoàn toàn việc parse string descriptor liên tục trong vòng lặp game.
            - **Zero-Copy Double Buffering**: Triển khai swap O(1) buffer hiển thị GPU Metal, triệt tiêu `std::memcpy` toàn màn hình trên các frame vẽ chuẩn.
            - **Cô Lập RMS Namespace & Xóa Save Data**: Tách biệt hoàn toàn namespace RMS RecordStore theo từng tựa game, giải quyết triệt để lỗi ghi đè dữ liệu chéo và cho phép xóa save game an toàn.
            - **Tích Hợp Tay Cầm Vật Lý (Apple GameController)**: Đồng bộ thực thụ tay cầm Bluetooth PS5, Xbox, MFi qua framework `GameController` (`GCController`) kèm cấu hình gán phím linh hoạt.
            - **Tinh Chỉnh Shaders GPU Bằng Uniform Buffer**: Truyền trực tiếp thông số độ sáng, tương phản, scanline và lcd grid vào Apple Metal Shaders.
            - **Thiết Kế UI/UX Hiện Đại**: Thanh điều khiển GameScreenView compact với Menu overflow; bàn phím ảo với bộ haptics dùng chung và cơ chế chống kẹt phím cảm ứng; hỗ trợ xem Thư viện game dạng Grid View đa cột kèm bộ lọc sắp xếp (A-Z, Z-A, Ngày thêm, Lần chơi gần nhất) và `ImageCacheManager` (`NSCache`) tối ưu mượt mà khi cuộn.
            - **Biên Dịch Đạt Chuẩn**: 100% C++ Core biên dịch đạt 0 Error, 0 Warning trên MSVC 2022 C++17 (/W3 /WX).
            
            - **Cài lên iPhone/iPad thật**: Tải file `J2HienLoader.ipa`.
            - **Test trên Web (Appetize.io)**: Tải file `J2HienLoader-Simulator-iPad.zip`.
          files: |
            **/build/*.ipa
            **/build/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit build moi nhat vao repo (dist/ chi .ipa goc)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist
          find . -path "*/build/*.ipa" -exec cp -f {} dist/ \;
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.ipa
          if git diff --cached --quiet; then
            echo "dist/ da moi nhat, khong can commit"
          else
            git commit -m "build: cap nhat IPA/dist moi nhat [skip ci]"
            git push || echo "push dist that bai (se thu lai lan sau)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}