name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-IPA
          path: |
            **/build/*.ipa

      - name: Upload Simulator Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-Simulator
          path: |
            **/build/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.9-j2hienloader
          name: "J2HienLoader iOS v1.8.9 - Khắc Phục Triệt Để 20 Lỗi Logic & Sai Lệch Đặc Tả Chuẩn Đối Chiếu Source Upstream"
          body: |
            ## J2HienLoader cho iOS & iPadOS (Bản chính thức v1.8.9)
            Ứng dụng giả lập J2ME chuẩn cho hệ điều hành iOS/iPadOS, nạp và chạy file .jar trực tiếp.
            
            ### Các sửa đổi toàn diện & triệt để trong v1.8.9 (Đối chiếu mã nguồn gốc Upstream):
            - **LcduiDisplay copyArea**: Triển khai `copyArea()` với bounds clipping và temporary buffer copy chống đè pixel vùng chồng lấn.
            - **Sprite computeTransformedBounds**: Tính bounding box chính xác cho cả 8 phép biến đổi Sprite (`TRANS_NONE`..`TRANS_MIRROR_ROT270`) theo `Sprite.java:1129-1300`.
            - **Sprite collidesWith(TiledLayer)**: Đối chiếu bounding box và kiểm tra pixel-level collision với từng tile cell của TiledLayer.
            - **Sprite collidesWith(Image)**: Đối chiếu bounding box và kiểm tra va chạm pixel với mảng pixel của Image.
            - **TiledLayer setStaticTileSet**: Cập nhật lại `numStaticTiles`, kích thước ảnh, `tileW`, `tileH` theo `TiledLayer.java:177-200`.
            - **TiledLayer paint**: Tính toán `startColumn`, `endColumn`, `startRow`, `endRow` culling theo clip rect của Graphics.
            - **TiledLayer getPixel**: Trích xuất màu ARGB pixel chuẩn xác của từng static và animated tile phục vụ va chạm pixel.
            - **String charAt & substring**: Ném `StringIndexOutOfBoundsException` trên chỉ số không hợp lệ, hỗ trợ multi-byte UTF-8 char indexing.
            - **String indexOf & lastIndexOf**: Ánh xạ chính xác hai chiều giữa character offset và byte offset UTF-8.
            - **StringBuffer / StringBuilder**: Bổ sung `insert()`, `indexOf()`, `substring()` ném ngoại lệ chuẩn JVM.
            - **Image getRGB**: Kiểm tra chặt chẽ biên MIDP, ném `NullPointerException`, `IllegalArgumentException`, `ArrayIndexOutOfBoundsException`.
            - **Graphics drawString & drawChars**: Kiểm tra null ném `NullPointerException`, kiểm tra offset/len ném `StringIndexOutOfBoundsException` / `ArrayIndexOutOfBoundsException`.
            - **Font API**: Lưu trữ face, style, size; tính `getHeight()` và `getBaselinePosition()` linh hoạt; kiểm tra null và bounds trong `stringWidth`, `charsWidth`.
            - **InputStream mark & reset**: Hỗ trợ `mark(readlimit)`, `reset()` về vị trí đánh dấu, `markSupported()` trả về 1 cho `ByteArrayInputStream`.
            - **Java Primitive Wrappers**: Boolean, Byte, Short, Character, Integer, Long, Float, Double lưu trữ giá trị thực tế, hỗ trợ `valueOf` và các hàm chuyển đổi kiểu.
            - **Java Collections**: `Hashtable` ném NPE trên get/remove/containsKey/contains; `Vector` ném `NoSuchElementException`/`ArrayIndexOutOfBoundsException`; `Stack` ném `EmptyStackException`.
            - **Calendar**: Tính toán đầy đủ `YEAR`, `MONTH`, `DATE`, `DAY_OF_WEEK`, `HOUR`, `HOUR_OF_DAY`, `MINUTE`, `SECOND`, `MILLISECOND`, `ZONE_OFFSET`.
            - **MascotCapsule Micro3D**: `AffineTrans` hỗ trợ set/get mảng 12 phần tử, lưu `affineTrans` trong `FigureLayout` và truyền ma trận xoay thực tế sang `Micro3DFigure.draw()`.
            - **Nokia Sound**: Chuẩn hóa mã trạng thái theo đặc tả chuẩn Nokia UI (`SOUND_PLAYING = 0`, `SOUND_STOPPED = 1`, `SOUND_UNINITIALIZED = 3`).
            - **IO & FileConnection**: `Connector.openInputStream`/`openOutputStream` bóc tách stream thực tế; `VolumeControl.setLevel` kẹp [0, 100] và trả về int; `FileConnection` sửa thứ tự chuẩn hóa đường dẫn, tạo file thật (`create`), tạo thư mục (`mkdir`), lấy thời gian sửa đổi (`lastModified`).
            
            - **Cài lên iPhone/iPad thật**: Tải file `J2HienLoader.ipa`.
            - **Test trên Web (Appetize.io)**: Tải file `J2HienLoader-Simulator-iPad.zip`.
          files: |
            **/build/*.ipa
            **/build/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit build moi nhat vao repo (dist/ chi .ipa goc)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist
          find . -path "*/build/*.ipa" -exec cp -f {} dist/ \;
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.ipa
          if git diff --cached --quiet; then
            echo "dist/ da moi nhat, khong can commit"
          else
            git commit -m "build: cap nhat IPA/dist moi nhat [skip ci]"
            git push || echo "push dist that bai (se thu lai lan sau)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}