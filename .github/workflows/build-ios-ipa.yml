name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-IPA
          path: |
            **/build/*.ipa

      - name: Upload Simulator Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-Simulator
          path: |
            **/build/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.4-j2hienloader
          name: "J2HienLoader iOS v1.8.4 - Bản chính thức IPA & Simulator"
          body: |
            ## J2HienLoader cho iOS & iPadOS (Bản chính thức v1.8.4)
            Ứng dụng giả lập J2ME chuẩn cho hệ điều hành iOS/iPadOS, nạp và chạy file .jar trực tiếp.
            
            ### Các cải tiến & bản vá trong v1.8.4:
            - **Sửa lỗi hiển thị chữ Object**: Khắc phục chuyển đổi chuỗi rỗng trong `String.valueOf`.
            - **Java SE Networking toàn diện**: Hỗ trợ đầy đủ `Socket`, `InetSocketAddress`, `URL`, `HttpURLConnection`, `Scanner` cho DragonBoy/NRO.
            - **Phục vụ Server List tức thì 0ms**: Cache RAM thông minh, cập nhật ngầm, bấm Đổi server không bị đứng hình.
            - **Loại bỏ Ghost Input (nhấn loạn/tự chọn nút)**: Chuyển sang `GameMTKView` thuần UIKit với cơ chế lọc phím mồ côi.
            - **Nâng cấp bàn phím ảo & cảm ứng**: Đảm bảo phản hồi siêu nhạy, không trễ, hỗ trợ toàn diện cả chạm và phím bấm.
            
            - **Cài lên iPhone/iPad thật**: Tải file `J2HienLoader.ipa`.
            - **Test trên Web (Appetize.io)**: Tải file `J2HienLoader-Simulator-iPad.zip`.
          files: |
            **/build/*.ipa
            **/build/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit build moi nhat vao repo (dist/ chi .ipa goc)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist
          find . -path "*/build/*.ipa" -exec cp -f {} dist/ \;
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.ipa
          if git diff --cached --quiet; then
            echo "dist/ da moi nhat, khong can commit"
          else
            git commit -m "build: cap nhat IPA/dist moi nhat [skip ci]"
            git push || echo "push dist that bai (se thu lai lan sau)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}