name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-IPA
          path: |
            **/build/*.ipa

      - name: Upload Simulator Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-Simulator
          path: |
            **/build/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.8-j2hienloader
          name: "J2HienLoader iOS v1.8.8 - Khắc Phục Triệt Để 15 Lỗi Logic & Sai Lệch Đặc Tả Chuẩn Đối Chiếu Source Upstream"
          body: |
            ## J2HienLoader cho iOS & iPadOS (Bản chính thức v1.8.8)
            Ứng dụng giả lập J2ME chuẩn cho hệ điều hành iOS/iPadOS, nạp và chạy file .jar trực tiếp.
            
            ### Các sửa đổi toàn diện & triệt để trong v1.8.8 (Đối chiếu mã nguồn gốc Upstream):
            - **Sửa hoán đổi phép biến đổi LCDUI drawRegion**: Đảo ngược đúng `case 4` (`TRANS_MIRROR_ROT270`) và `case 7` (`TRANS_MIRROR_ROT90`) theo bitmask chuẩn `INVERTED_AXES` (0x4).
            - **Đồng bộ hóa Sprite transforms & reference pixel**: Triển khai `getTransformedPtX` và `getTransformedPtY` chuẩn; sửa `setTransform` cập nhật bù trừ `(oldRef - newRef)` để bảo toàn điểm reference pixel; `setRefPixelPosition` và `getRefPixelX/Y` tính đến transform hiện tại.
            - **Chuẩn hóa LayerManager View Window & Clipping**: Thiết lập cửa sổ view mặc định `Integer.MAX_VALUE` theo upstream Java; `append()` và `insert()` loại bỏ layer trùng lặp trước khi thêm; `paint()` dịch chuyển hệ toạ độ và giao cắt clipRect chuẩn MIDP 2.0.
            - **Lưu trữ RMS chuẩn xác & chống tái sử dụng Record ID**: Bổ sung `getSize()` tính tổng byte thực tế của record store; lưu và phục hồi `nextRecordId` qua header định dạng `RMS2` đảm bảo ID bản ghi đơn điệu tăng dần theo chuẩn RMS 2.0; sửa lỗi thiếu `return true` trong `getRecord()`.
            - **Chuyển vị ảnh chuẩn trong Image.createImage**: Sửa khớp các trục toạ độ dx, dy cho toàn bộ họ biến đổi xoay 90/180/270 và lật gương; hỗ trợ tạo immutable copy từ Image nguồn.
            - **Bảo toàn ký tự UTF-8 trong Graphics.drawSubstring**: Áp dụng `utf8CharToByteOffset` ngăn chặn việc cắt xén giữa các byte của ký tự tiếng Việt có dấu.
            - **Bổ sung các hàm đồ họa Graphics MIDP 2.0**: Triển khai `fillTriangle`, `setGrayScale`, `getGrayScale`, `getDisplayColor`, `setStrokeStyle`, `getStrokeStyle`.
            - **Hoàn thiện Font API**: Triển khai `substringWidth` hỗ trợ unicode offset; bổ sung đầy đủ các getter thuộc tính font (`getStyle`, `getSize`, `getFace`, `isPlain`, `isBold`, `isItalic`, `isUnderlined`).
            - **Mở rộng phím & hành động game Canvas**: Bổ sung `GAME_A` (9, '7'), `GAME_B` (10, '9'), `GAME_C` (11, '*'), `GAME_D` (12, '#') cho `getGameAction` và `getKeyCode`; triển khai `getKeyName(keyCode)`.
            - **Ném ngoại lệ chuẩn trong System.arraycopy**: Kiểm tra null ném `NullPointerException` và kiểm tra biên ném `IndexOutOfBoundsException` theo đặc tả JVM.
            - **Tự động phân giải đường dẫn tương đối trong Class.getResourceAsStream**: Ghép tiền tố package thư mục của lớp gọi khi nạp tài nguyên theo đường dẫn tương đối.
            - **Định tuyến buffer chuẩn cho DataOutputStream**: Chuyển tiếp toàn bộ thao tác ghi sang buffer của luồng `ByteArrayOutputStream` bên trong (decorator pattern).
            - **Hỗ trợ toàn diện phép biến đổi Nokia DirectGraphics**: Ánh xạ đầy đủ `manipulation` (FLIP_H, FLIP_V, ROTATE_90/180/270) sang Sprite transform; `drawPixels` hỗ trợ vẽ pixel mảng kết hợp xoay lật.
            - **Theo dõi máy trạng thái MMAPI Player**: Quản lý vòng đời `REALIZED` (200), `PREFETCHED` (300), `STARTED` (400), `CLOSED` (0) và phản hồi chính xác qua `getState()`.
            - **Duyệt ngược RecordEnumeration & chuẩn hóa Math/Collection**: Bổ sung `previousRecordId()` và `previousRecord()`; `Hashtable.put` ném NPE khi key/value null; `Enumeration.nextElement` ném `NoSuchElementException`; `Math.round(float)` dùng `std::floor(a + 0.5f)` chuẩn Java; bổ sung `Math.IEEEremainder`.
            
            - **Cài lên iPhone/iPad thật**: Tải file `J2HienLoader.ipa`.
            - **Test trên Web (Appetize.io)**: Tải file `J2HienLoader-Simulator-iPad.zip`.
          files: |
            **/build/*.ipa
            **/build/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit build moi nhat vao repo (dist/ chi .ipa goc)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist
          find . -path "*/build/*.ipa" -exec cp -f {} dist/ \;
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.ipa
          if git diff --cached --quiet; then
            echo "dist/ da moi nhat, khong can commit"
          else
            git commit -m "build: cap nhat IPA/dist moi nhat [skip ci]"
            git push || echo "push dist that bai (se thu lai lan sau)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}