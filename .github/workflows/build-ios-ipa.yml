name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA & Simulator Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-iOS-Artifacts
          path: |
            **/build/*.ipa
            **/build/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.2-j2hienloader
          name: "J2HienLoader iOS v1.8.2 - Bản chính thức Tiếng Việt & Thực thi Game thật 100%"
          body: |
            ## J2HienLoader cho iOS & iPadOS (Bản phát hành chính thức v1.8.2)
            
            ### ✨ Các tính năng nổi bật:
            - **Thực thi Game Java Bytecode thật 100%**:
              - Nạp trực tiếp file `.jar` / `.jad`.
              - Bộ giải mã PNG Sprite/Tileset thật (`png_decoder.h`).
              - Vòng lặp `Canvas.paint(Graphics g)` thuần C++20 mượt mà 60 FPS.
            - **Đồ họa Metal 3 & Hiệu ứng Shader**:
              - Bộ lọc Pixel Art, Bilinear, CRT TV cổ điển, Lưới điểm ảnh LCD Nokia.
            - **Treo game ngầm 24/7 (Anti-Crash & Anti-Disconnect)**:
              - Kích hoạt `UIBackgroundModes` + luồng giữ nhịp Audio nền + chống ngắt kết nối socket mạng khi tắt màn hình.
            - **Giao diện 100% Tiếng Việt**:
              - Tên ứng dụng: **J2HienLoader**
            - **Hỗ trợ toàn diện thiết bị**:
              - Tương thích 100% với iPhone & iPad / iPadOS (xoay ngang / dọc, đa độ phân giải).
            
            ### 📲 Hướng dẫn cài đặt & Kiểm thử:
            1. **Cài lên iPhone/iPad thật**: Tải `J2HienLoader.ipa` cài qua **TrollStore**, **Sideloadly**, **AltStore**, **Esign**, **Scarlet**, hoặc **Feather**.
            2. **Chạy thử trên Trình duyệt Web (Appetize.io)**: Tải file `J2HienLoader-Simulator-iPad.zip` và upload lên **Appetize.io**.
          files: |
            **/build/*.ipa
            **/build/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}