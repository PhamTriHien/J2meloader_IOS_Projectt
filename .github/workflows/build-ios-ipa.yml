name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-IPA
          path: |
            **/build/*.ipa

      - name: Upload Simulator Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-Simulator
          path: |
            **/build/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.5-j2hienloader
          name: "J2HienLoader iOS v1.8.5 - Tối ưu 60 FPS, Xóa bỏ Giật Lag, Đơ & Drop Frame Trên Máy Thật"
          body: |
            ## J2HienLoader cho iOS & iPadOS (Bản chính thức v1.8.5)
            Ứng dụng giả lập J2ME chuẩn cho hệ điều hành iOS/iPadOS, nạp và chạy file .jar trực tiếp.
            
            ### Các cải tiến & tối ưu hiệu năng đột phá trong v1.8.5:
            - **Adaptive 60 FPS Frame Pacer**: Bộ điều phối nhịp thời gian động trừ đi thời gian vẽ thực tế thay vì sleep cứng 16ms, đưa tốc độ khung hình đạt 60 FPS mượt mà tuyệt đối.
            - **Cơ chế Dirty-Flag Metal Texture Upload**: Chỉ cập nhật và tải texture lên GPU khi LCDUI có frame mới (currentTick != lastPaintTick), giảm tải 100% việc copy bộ nhớ thừa thãi giữa CPU và GPU.
            - **Zero-Lock LCDUI Rendering**: Loại bỏ toàn bộ mutex lock trên từng pixel / lệnh vẽ nguyên thuỷ (drawLine, fillRect, drawRegion, drawString...), chỉ khóa atomic khi hoán đổi khung hình (publishFrame).
            - **Tối ưu Fast-Path drawRegion 32-bit**: Trực tiếp ghi thanh ghi 32-bit bộ nhớ ARGB cho các ảnh không xoay (transform == 0), loại bỏ switch-case và phép chia pixel-by-pixel.
            - **O(1) Constant Pool Field Resolution**: Cache trực tiếp tên trường và offset trong Constant Pool cho `OP_GETFIELD`/`OP_PUTFIELD`, loại bỏ phân bổ bộ nhớ chuỗi và substr() trên mỗi chu kỳ CPU.
            - **Negative Class Lookup Caching**: Lưu trữ các lớp hệ thống không tìm thấy vào `m_failedClasses` hash set, chấm dứt việc quét lại toàn bộ file ZIP JAR ở mỗi lần load class.
            - **Triệt tiêu khựng giật Socket (Network Stall)**: Rút ngắn thời gian timeout `select()` từ 1.5 giây xuống còn 20ms, loại bỏ hoàn toàn hiện tượng khựng đơ khi nhận gói tin mạng từ máy chủ.
            - **Bật tối ưu hóa biên dịch mã máy `-Os`**: Thêm `GCC_OPTIMIZATION_LEVEL = s` trong Xcode release build config.
            
            - **Cài lên iPhone/iPad thật**: Tải file `J2HienLoader.ipa`.
            - **Test trên Web (Appetize.io)**: Tải file `J2HienLoader-Simulator-iPad.zip`.
          files: |
            **/build/*.ipa
            **/build/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit build moi nhat vao repo (dist/ chi .ipa goc)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist
          find . -path "*/build/*.ipa" -exec cp -f {} dist/ \;
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.ipa
          if git diff --cached --quiet; then
            echo "dist/ da moi nhat, khong can commit"
          else
            git commit -m "build: cap nhat IPA/dist moi nhat [skip ci]"
            git push || echo "push dist that bai (se thu lai lan sau)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}