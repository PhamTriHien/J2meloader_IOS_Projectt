name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-IPA
          path: |
            **/build/*.ipa

      - name: Upload Simulator Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-Simulator
          path: |
            **/build/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.6-j2hienloader
          name: "J2HienLoader iOS v1.8.6 - Sửa Toàn Diện 11 Lỗi Logic & Bug Ẩn Cốt Lõi JVM/J2ME"
          body: |
            ## J2HienLoader cho iOS & iPadOS (Bản chính thức v1.8.6)
            Ứng dụng giả lập J2ME chuẩn cho hệ điều hành iOS/iPadOS, nạp và chạy file .jar trực tiếp.
            
            ### Các sửa đổi toàn diện & triệt để trong v1.8.6:
            - **Sửa lỗi OP_LOOKUPSWITCH**: Bổ sung `break;` ngăn việc đọc nhầm mã đích của lệnh switch làm bảng tra cứu offset.
            - **Chuẩn hóa 64-bit Parameter Mapping (JVMS §2.6.1)**: Tăng 2 slot biến cục bộ cho kiểu `long` và `double`, đảm bảo các tham số phía sau không bị lệch vị trí.
            - **Sửa lỗi OP_POP2, OP_DUP2, OP_DUP_X2**: Xử lý đúng kiểu Category 2 (long/double) thay vì pop hoặc duplicate sai số lượng phần tử.
            - **Đồng bộ Suite Name trong RMS**: Khắc phục lỗi lưu file RMS vào `Default_` trong khi mở từ `J2MEApp_`, đảm bảo dữ liệu lưu game không bị biến mất khi khởi động lại.
            - **Hoàn thiện đầy đủ API RecordStore & RecordEnumeration**: Hỗ trợ `setRecord`, `deleteRecord`, `deleteRecordStore`, `getRecord(int, byte[], int)` và duyệt qua danh sách bản ghi đã lưu.
            - **Nâng cấp ByteArrayInputStream & readFully**: Hỗ trợ constructor 3 tham số `(byte[], offset, len)` và đọc trọn vẹn gói tin mạng thay vì đọc dở dang.
            - **Ném ngoại lệ EOFException chuẩn**: `readByte`, `readShort`, `readInt` ném `EOFException` khi hết luồng thay vì trả về 0 gây lỗi logic ngầm.
            - **Kết nối GameCanvas.getKeyStates()**: Trả về bitmask phím thực tế từ `JvmInterpreter` giúp các game hành động nhận diện phím bấm chính xác.
            - **Triệt tiêu TimerTask Zombie Threads**: Hủy bỏ luồng chạy ngầm vô tận khi MIDlet gọi `Timer.cancel()` hoặc `TimerTask.cancel()`.
            - **Hashtable Boxed Object Matching**: Hỗ trợ so sánh khóa `Integer`, `Long`, `String` theo giá trị thay vì chỉ so sánh con trỏ/reference.
            - **Dọn dẹp Socket FD**: Tự động đóng tất cả các socket mở trong `FullApis::reset()` tránh rò rỉ tài nguyên hệ thống.
            
            - **Cài lên iPhone/iPad thật**: Tải file `J2HienLoader.ipa`.
            - **Test trên Web (Appetize.io)**: Tải file `J2HienLoader-Simulator-iPad.zip`.
          files: |
            **/build/*.ipa
            **/build/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit build moi nhat vao repo (dist/ chi .ipa goc)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist
          find . -path "*/build/*.ipa" -exec cp -f {} dist/ \;
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.ipa
          if git diff --cached --quiet; then
            echo "dist/ da moi nhat, khong can commit"
          else
            git commit -m "build: cap nhat IPA/dist moi nhat [skip ci]"
            git push || echo "push dist that bai (se thu lai lan sau)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}