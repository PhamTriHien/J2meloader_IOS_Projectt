name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-IPA
          path: |
            **/build/*.ipa

      - name: Upload Simulator Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-Simulator
          path: |
            **/build/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.7-j2hienloader
          name: "J2HienLoader iOS v1.8.7 - Sửa Toàn Diện 15 Lỗi Logic & Ngoại Lệ Runtime Cốt Lõi JVM/LCDUI/RMS"
          body: |
            ## J2HienLoader cho iOS & iPadOS (Bản chính thức v1.8.7)
            Ứng dụng giả lập J2ME chuẩn cho hệ điều hành iOS/iPadOS, nạp và chạy file .jar trực tiếp.
            
            ### Các sửa đổi toàn diện & triệt để trong v1.8.7:
            - **Dọn dẹp Pending Exception**: Triệt tiêu rò rỉ ngoại lệ chưa bắt tại ranh giới executeMethod (`DepthGuard`), ngăn chặn ô nhiễm trạng thái luồng game giữa các tick render và sự kiện phím/chuột.
            - **Xử lý triệt để phép chia số học 0 & SIGFPE**: Ném `ArithmeticException` và chặn crash phần cứng SIGFPE khi chia cho 0 hoặc chia `INT_MIN` cho `-1` trong `OP_IDIV`, `OP_IREM`, `OP_LDIV`, `OP_LREM`.
            - **Ném NullPointerException trong OP_ARRAYLENGTH**: Ném `NullPointerException` chuẩn khi đối tượng mảng null thay vì âm thầm trả về 0.
            - **Hỗ trợ kiểm tra mảng trong OP_INSTANCEOF**: Kiểm tra chuẩn xác các kiểu mảng (`JavaArray`) với `[B`, `[I`, `java/lang/Object` v.v.
            - **Ném NullPointerException trong OP_ATHROW**: Tự động cấp phát và dispatch `NullPointerException` nếu đối tượng ngoại lệ ném ra là null.
            - **Chuẩn hóa Unicode trong String.substring & getChars**: Tính toán chính xác vị trí ký tự UTF-16 sang byte offset UTF-8, khắc phục hoàn toàn lỗi vỡ chuỗi tiếng Việt có dấu.
            - **Chuẩn hóa StringBuffer.append(null)**: Nối chuỗi `"null"` đúng đặc tả Java SE/ME khi nối đối tượng null.
            - **Ném EOFException trong DataInputStream.readUTF**: Ném `EOFException` chuẩn khi luồng dữ liệu UTF bị kết thúc sớm.
            - **Tối ưu hóa JavaArray::length() O(1)**: Chuyển đổi sang switch-case theo `elemType`, giảm độ trễ truy cập độ dài mảng.
            - **Bù trừ Translation trong Graphics.getClipX/getClipY**: Trả về tọa độ tương đối theo `m_transX/m_transY` đúng chuẩn MIDP 2.0.
            - **Khắc phục lỗi vẽ Graphics.drawRoundRect & fillRoundRect**: Loại bỏ dịch chuyển tọa độ bị cộng 2 lần trong `drawRoundRect` và sửa cận lặp trong `fillRoundRect`.
            - **Bảo toàn Clip trong LayerManager.paint()**: Lưu và khôi phục chính xác vùng clip gốc của Graphics trước và sau khi vẽ các layer.
            - **Hoàn thiện đầy đủ API TiledLayer & LayerManager**: Triển khai `getColumns`, `getRows`, `getCellWidth`, `getCellHeight`, `getSize`, `getLayerAt` thực tế thay vì các giá trị ước lượng.
            - **Hoàn thiện API RMS getNextRecordID & getRecordSize**: Bổ sung hỗ trợ đầy đủ và an toàn đa luồng cho RecordStore.
            - **Chuẩn hóa kiểu Math.min/max (FF)F**: Trả về đúng giá trị kiểu Float, tránh nhầm lẫn sang Integer.
            
            - **Cài lên iPhone/iPad thật**: Tải file `J2HienLoader.ipa`.
            - **Test trên Web (Appetize.io)**: Tải file `J2HienLoader-Simulator-iPad.zip`.
          files: |
            **/build/*.ipa
            **/build/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit build moi nhat vao repo (dist/ chi .ipa goc)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist
          find . -path "*/build/*.ipa" -exec cp -f {} dist/ \;
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.ipa
          if git diff --cached --quiet; then
            echo "dist/ da moi nhat, khong can commit"
          else
            git commit -m "build: cap nhat IPA/dist moi nhat [skip ci]"
            git push || echo "push dist that bai (se thu lai lan sau)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}