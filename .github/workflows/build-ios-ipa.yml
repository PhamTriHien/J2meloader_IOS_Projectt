name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-IPA
          path: |
            **/build/*.ipa

      - name: Upload Simulator Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: J2HienLoader-Simulator
          path: |
            **/build/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.9.0-j2hienloader
          name: "J2HienLoader iOS v1.9.0 - Đo Đạc FPS Thời Gian Thực Chuẩn Xác & Đồng Bộ Tốc Độ Giả Lập Speed Multiplier"
          body: |
            ## J2HienLoader cho iOS & iPadOS (Bản chính thức v1.9.0)
            Ứng dụng giả lập J2ME chuẩn cho hệ điều hành iOS/iPadOS, nạp và chạy file .jar trực tiếp.
            
            ### Các cải tiến & chuẩn hóa trong v1.9.0:
            - **Đo Đạc FPS Thời Gian Thực (True Real-Time FPS Sampling)**: Triển khai thuật toán đo FPS trên luồng MetalRenderer dựa theo chuẩn FpsCounter từ playsoftware/J2ME-Loader (javax.microedition.lcdui.overlay.FpsCounter). Sử dụng CACurrentMediaTime() đo đạc số frame thực tế được render trong từng cửa sổ 0.5 giây và cập nhật trực tiếp lên UI.
            - **Dynamic Emulation Speed Pacing**: Tích hợp `std::atomic<int> m_speedMultiplier` trong `JvmInterpreter`. Đồng bộ hóa tốc độ vòng lặp thực thi bytecode (1x: 60 FPS, 2x: 120 FPS, 4x: 240 FPS) kèm `preferredFramesPerSecond` của MTKView, đảm bảo game chạy nhanh thật khi bấm phím 2x/4x.
            - **Real-Time FPS Badge & Header**: Thanh header và huy hiệu FPS hiển thị chính xác FPS thực tế đang render kèm phân loại màu sắc động (Xanh lá >= 50 FPS, Vàng 30-49 FPS, Cam < 30 FPS).
            - **Auto Reset**: Tự động reset tốc độ giả lập về 1x khi thoát khỏi game hoặc quay lại thư viện game, chống rò rỉ trạng thái.
            - **Biên Dịch Đạt Chuẩn**: 100% C++ Core biên dịch đạt 0 Error, 0 Warning trên MSVC 2022 C++17 (/W3 /WX).
            
            - **Cài lên iPhone/iPad thật**: Tải file `J2HienLoader.ipa`.
            - **Test trên Web (Appetize.io)**: Tải file `J2HienLoader-Simulator-iPad.zip`.
          files: |
            **/build/*.ipa
            **/build/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit build moi nhat vao repo (dist/ chi .ipa goc)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist
          find . -path "*/build/*.ipa" -exec cp -f {} dist/ \;
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.ipa
          if git diff --cached --quiet; then
            echo "dist/ da moi nhat, khong can commit"
          else
            git commit -m "build: cap nhat IPA/dist moi nhat [skip ci]"
            git push || echo "push dist that bai (se thu lai lan sau)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}