name: Build J5Hienloader Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: universal_loader/ui_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android release
        if: matrix.platform == 'android'
        run: flutter build apk --release --target-platform android-arm64,android-x64 --split-per-abi --no-tree-shake-icons
      - name: Build Windows release
        if: matrix.platform == 'windows'
        run: flutter build windows --release --no-tree-shake-icons
      - name: Package ChromeOS APKs
        if: matrix.platform == 'android'
        run: |
          mkdir -p build/chromeos
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/chromeos/J5Hienloader-ChromeOS-x86_64.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/chromeos/J5Hienloader-ChromeOS-arm64.apk
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'android'
        with:
          name: J5Hienloader-release-chromeos
          if-no-files-found: error
          path: universal_loader/ui_app/build/chromeos/*.apk
      - name: Build unsigned iOS release
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --config-only --release --no-codesign
          cd ios
          pod install
          cd ..
          flutter build ios --release --no-codesign --no-tree-shake-icons
          mkdir -p build/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned/Payload/
          cd build/unsigned
          zip -qr ../J5Hienloader-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: J5Hienloader-release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            universal_loader/ui_app/build/app/outputs/flutter-apk/*-release.apk
            universal_loader/ui_app/build/windows/x64/runner/Release/
            universal_loader/ui_app/build/J5Hienloader-unsigned.ipa
