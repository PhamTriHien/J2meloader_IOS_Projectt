name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build App
        run: |
          mkdir -p build/Release-iphoneos
          echo "Starting xcodebuild..."
          xcodebuild build \
            -project J2MELoader-iOS.xcodeproj \
            -scheme J2MELoader-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES > xcodebuild_raw.log 2>&1 || BUILD_FAILED=1

          if [ "$BUILD_FAILED" = "1" ]; then
            python3 -c "
import json, urllib.request, os
with open('xcodebuild_raw.log', 'r', errors='ignore') as f:
    lines = f.readlines()
errs = [l for l in lines if any(k in l for k in ['error:', 'fatal error:', 'BUILD FAILED', 'warning:'])]
body = '### Xcode Build Failure Log\n\n```text\n' + ''.join(errs[-80:]) + '\n```\n\n### Last Lines:\n```text\n' + ''.join(lines[-40:]) + '\n```'
data = json.dumps({'title': 'CI Build Log', 'body': body[:65000]}).encode('utf-8')
req = urllib.request.Request(
    'https://api.github.com/repos/${{ github.repository }}/issues',
    data=data,
    headers={'Authorization': 'token ${{ secrets.GITHUB_TOKEN }}', 'Content-Type': 'application/json', 'User-Agent': 'CI'}
)
try:
    urllib.request.urlopen(req)
except Exception as e:
    print('Issue error:', e)
"
            cat xcodebuild_raw.log
            exit 1
          fi

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/J2MELoader-iOS.app build/Payload/
          cd build
          zip -r -y J2MELoader-iOS.ipa Payload
          echo "IPA created successfully at $(pwd)/J2MELoader-iOS.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2MELoader-iOS-ipa
          path: build/J2MELoader-iOS.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.2-ios
          name: "J2ME-Loader iOS v1.8.2 (Native IPA for iPhone / iPad)"
          body: |
            ### 🎮 J2ME-Loader for iOS (Native Port)
            **Version**: 1.8.2
            **Architecture**: ARM64 (iOS 15.0+ / iPadOS 15.0+)
            
            #### Features Included:
            - **Complete UI & Engine**: Full native SwiftUI + Metal shader pipeline (Nearest, Bilinear, CRT Scanlines, LCD Grid).
            - **CoreAudio & AVMIDIPlayer**: Crystal clear SoundFont / MIDI synthesizer and real-time Tone generator.
            - **J2ME Runtime**: LCDUI Graphics, GameCanvas (Sprites & TiledLayer), M3G (JSR-184) 3D, Micro3D v3, RMS Flash Storage.
            - **Virtual Controls & Key Mapper**: Retro phone keypad, D-pad, touch overlay, and MFi/Bluetooth controller support.
            - **Full Sideload Support**: Compatible with TrollStore, Sideloadly, AltStore, Feather, and Scarlet.
          files: build/J2MELoader-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}