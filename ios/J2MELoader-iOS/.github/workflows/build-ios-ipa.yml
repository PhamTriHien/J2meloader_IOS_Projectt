name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build App
        run: |
          mkdir -p build/Release-iphoneos
          echo "Starting xcodebuild..."
          xcodebuild build \
            -project J2MELoader-iOS.xcodeproj \
            -scheme J2MELoader-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES > xcodebuild.log 2>&1 || {
              echo "=== XCODEBUILD FAILED ==="
              tail -n 250 xcodebuild.log
              exit 1
            }
          echo "Build finished successfully."

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/J2MELoader-iOS.app build/Payload/
          cd build
          zip -r -y J2MELoader-iOS.ipa Payload
          echo "IPA created successfully at $(pwd)/J2MELoader-iOS.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2MELoader-iOS-ipa
          path: build/J2MELoader-iOS.ipa