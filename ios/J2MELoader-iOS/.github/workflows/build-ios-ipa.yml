name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build App
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          
          mkdir -p build/Release-iphoneos
          
          echo "Starting xcodebuild..."
          set -o pipefail
          xcodebuild build \
            -project J2MELoader-iOS.xcodeproj \
            -target J2MELoader-iOS \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || {
              echo "=== BUILD FAILED. RELEVANT ERRORS: ==="
              grep -E "(error:|fatal error:|BUILD FAILED|\*\* BUILD FAILED \*\*)" xcodebuild.log -B 2 -A 4 || tail -n 50 xcodebuild.log
              exit 1
            }

      - name: Package Payload to IPA
        run: |
          if [ -d "ios/J2MELoader-iOS" ]; then
            cd ios/J2MELoader-iOS
          fi
          
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/J2MELoader-iOS.app build/Payload/
          cd build
          zip -r -y J2MELoader-iOS.ipa Payload
          echo "IPA created successfully at $(pwd)/J2MELoader-iOS.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2MELoader-iOS-ipa
          path: |
            build/J2MELoader-iOS.ipa
            ios/J2MELoader-iOS/build/J2MELoader-iOS.ipa