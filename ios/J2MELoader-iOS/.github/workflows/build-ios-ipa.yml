name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build App
        run: |
          mkdir -p build/Release-iphoneos
          echo "Starting xcodebuild..."
          xcodebuild build \
            -project J2MELoader-iOS.xcodeproj \
            -scheme J2MELoader-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES > build.log 2>&1 || BUILD_FAILED=1

          if [ "$BUILD_FAILED" = "1" ]; then
            echo "::error::Build Failed! Pushing logs to build-log branch..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-log
            cp build.log build_failure_log.txt
            git add build_failure_log.txt
            git commit -m "chore(ci): save build failure log [skip ci]" || true
            git push origin build-log --force || true
            tail -n 120 build.log
            exit 1
          fi

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/J2MELoader-iOS.app build/Payload/
          cd build
          zip -r -y J2MELoader-iOS.ipa Payload
          echo "IPA created successfully at $(pwd)/J2MELoader-iOS.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2MELoader-iOS-ipa
          path: build/J2MELoader-iOS.ipa